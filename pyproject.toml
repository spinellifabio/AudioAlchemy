[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audioalchemy"
version = "0.1.0"
description = "Batch audio conversion and metadata management CLI tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fabio Spinelli" }]
keywords = ["audio", "conversion", "metadata", "cli", "batch"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pydub>=0.25",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
audioalchemy = "audioalchemy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audioalchemy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
