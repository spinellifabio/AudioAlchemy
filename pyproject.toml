[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audioalchemy"
version = "0.1.1"
description = "Batch audio conversion and metadata management CLI tool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fabio Spinelli" }]
keywords = ["audio", "conversion", "metadata", "cli", "batch"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pydub>=0.25",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "mutagen>=1.47",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/spinellifabio/AudioAlchemy"
Issues = "https://github.com/spinellifabio/AudioAlchemy/issues"
Changelog = "https://github.com/spinellifabio/AudioAlchemy/blob/main/CHANGELOG.md"

[project.scripts]
audioalchemy = "audioalchemy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audioalchemy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# typer declares arguments as call defaults
ignore = ["B008"]
